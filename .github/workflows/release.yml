name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.4)'
        required: true
        default: 'v1.4.4'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $TAG = "${{ github.event.inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Path DF-Loadout-Scanner
          Copy-Item target/release/df_clipboard_helper.exe DF-Loadout-Scanner/DF-Loadout-Scanner-Windows-x64.exe
          Copy-Item README.md DF-Loadout-Scanner/README.md
          Copy-Item LICENSE DF-Loadout-Scanner/LICENSE
          Compress-Archive -Path DF-Loadout-Scanner -DestinationPath "DF-Loadout-Scanner-$TAG-Windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DF Loadout Scanner ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            DF-Loadout-Scanner-${{ github.event.inputs.tag || github.ref_name }}-Windows-x64.zip
          generate_release_notes: true
