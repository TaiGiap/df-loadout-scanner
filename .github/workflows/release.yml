name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.1-beta)'
        required: true
        default: 'v2.0.1-beta'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version consistency
        shell: pwsh
        run: |
          $TAG = "${{ github.event.inputs.tag || github.ref_name }}"
          if (-not $TAG.StartsWith("v")) {
            Write-Error "Release tag '$TAG' must start with 'v' (e.g. v1.4.6)"
            exit 1
          }
          $VER = $TAG.Substring(1)

          $cargoContent = Get-Content Cargo.toml -Raw
          if ($cargoContent -notmatch "(?m)^version\s*=\s*""$([regex]::Escape($VER))""") {
            Write-Error "Cargo.toml version does not match tag $TAG"
            exit 1
          }

          $mainContent = Get-Content src/main.rs -Raw
          if ($mainContent -notmatch "const\s+APP_VERSION:\s*&str\s*=\s*""$([regex]::Escape($TAG))""") {
            Write-Error "src/main.rs APP_VERSION does not match tag $TAG"
            exit 1
          }

          $readmeContent = Get-Content README.md -Raw
          if ($readmeContent -notmatch [regex]::Escape("DF-Loadout-Scanner-$TAG-Windows-x64.zip")) {
            Write-Error "README.md download zip link does not match $TAG"
            exit 1
          }
          if ($readmeContent -notmatch [regex]::Escape("**$TAG (Mới nhất)**")) {
            Write-Error "README.md Changelog is missing '**$TAG (Mới nhất)**'"
            exit 1
          }

          Write-Host "Version check passed for $TAG ($VER) across Git tag, Cargo.toml, src/main.rs, and README.md!"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download ONNX Runtime DLL
        shell: pwsh
        run: |
          $ortVer = "1.31.1"
          $nupkg = "$env:RUNNER_TEMP\microsoft.ml.onnxruntime.$ortVer.zip"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ortVer/microsoft.ml.onnxruntime.$ortVer.nupkg" -OutFile $nupkg
          $extractDir = "$env:RUNNER_TEMP\ort_pkg"
          Expand-Archive -Path $nupkg -DestinationPath $extractDir -Force
          $dllPath = "$extractDir\runtimes\win-x64\native\onnxruntime.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "Missing onnxruntime.dll inside NuGet package"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "target/debug/deps", "target/release" | Out-Null
          Copy-Item $dllPath "target/debug/onnxruntime.dll" -Force
          Copy-Item $dllPath "target/debug/deps/onnxruntime.dll" -Force
          Copy-Item $dllPath "target/release/onnxruntime.dll" -Force

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $TAG = "${{ github.event.inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Path DF-Loadout-Scanner
          Copy-Item target/release/df_clipboard_helper.exe DF-Loadout-Scanner/DF-Loadout-Scanner-Windows-x64.exe
          Copy-Item target/release/onnxruntime.dll DF-Loadout-Scanner/onnxruntime.dll
          if (-not (Test-Path DF-Loadout-Scanner/onnxruntime.dll)) {
            Write-Error "onnxruntime.dll missing from release bundle"
            exit 1
          }
          Copy-Item README.md DF-Loadout-Scanner/README.md
          Copy-Item LICENSE DF-Loadout-Scanner/LICENSE
          $zipName = "DF-Loadout-Scanner-$TAG-Windows-x64.zip"
          Compress-Archive -Path DF-Loadout-Scanner -DestinationPath $zipName
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $zipName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", "$sha256  $zipName`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "Generated SHA256SUMS.txt: $sha256  $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DF Loadout Scanner ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            DF-Loadout-Scanner-${{ github.event.inputs.tag || github.ref_name }}-Windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
