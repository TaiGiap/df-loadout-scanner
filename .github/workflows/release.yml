name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.6)'
        required: true
        default: 'v1.4.6'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version consistency
        shell: pwsh
        run: |
          $TAG = "${{ github.event.inputs.tag || github.ref_name }}"
          if (-not $TAG.StartsWith("v")) {
            Write-Error "Release tag '$TAG' must start with 'v' (e.g. v1.4.6)"
            exit 1
          }
          $VER = $TAG.Substring(1)

          $cargoContent = Get-Content Cargo.toml -Raw
          if ($cargoContent -notmatch "(?m)^version\s*=\s*""$([regex]::Escape($VER))""") {
            Write-Error "Cargo.toml version does not match tag $TAG"
            exit 1
          }

          $mainContent = Get-Content src/main.rs -Raw
          if ($mainContent -notmatch "const\s+APP_VERSION:\s*&str\s*=\s*""$([regex]::Escape($TAG))""") {
            Write-Error "src/main.rs APP_VERSION does not match tag $TAG"
            exit 1
          }

          $readmeContent = Get-Content README.md -Raw
          if ($readmeContent -notmatch [regex]::Escape("DF-Loadout-Scanner-$TAG-Windows-x64.zip")) {
            Write-Error "README.md download zip link does not match $TAG"
            exit 1
          }
          if ($readmeContent -notmatch [regex]::Escape("**$TAG (Mới nhất)**")) {
            Write-Error "README.md Changelog is missing '**$TAG (Mới nhất)**'"
            exit 1
          }

          Write-Host "Version check passed for $TAG ($VER) across Git tag, Cargo.toml, src/main.rs, and README.md!"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $TAG = "${{ github.event.inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Path DF-Loadout-Scanner
          Copy-Item target/release/df_clipboard_helper.exe DF-Loadout-Scanner/DF-Loadout-Scanner-Windows-x64.exe
          Copy-Item README.md DF-Loadout-Scanner/README.md
          Copy-Item LICENSE DF-Loadout-Scanner/LICENSE
          Compress-Archive -Path DF-Loadout-Scanner -DestinationPath "DF-Loadout-Scanner-$TAG-Windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DF Loadout Scanner ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            DF-Loadout-Scanner-${{ github.event.inputs.tag || github.ref_name }}-Windows-x64.zip
          generate_release_notes: true
