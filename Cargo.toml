[package]
name = "df_clipboard_helper"
version = "1.4.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/TaiGiap/df-loadout-scanner"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
xcap = "0.0.14"
arboard = "3.4"
strsim = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_WinRT",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
] }
ureq = { version = "2.10", features = ["json"] }
qrcode = { version = "0.14.1", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

